<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>{{ app_name }}</title><link rel=stylesheet href=/static/style.css></head><body><main class=auth><h1>{{ app_name }}</h1><p>Free/open-source developer AI starter.</p>{% if error %}<div class=err>{{error}}</div>{% endif %}<form method=post><input type=hidden name=csrf value="{{csrf_token}}"><input name=email type=email placeholder="Email" required><input name=password type=password placeholder="Password" required><button>{{ 'Create account' if mode=='signup' else 'Log in' }}</button></form><a href="{{ '/signup' if mode=='login' else '/login' }}">{{ 'Create an account' if mode=='login' else 'Already have an account? Log in' }}</a></main></body></html>
